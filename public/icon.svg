<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="104" fill="#ffffff" />
  
  <g transform="translate(256, 256)">
    <!-- Top yellow arc -->
    <path d="M -90 -160 A 184 184 0 0 1 140 -90 L 105 -65 A 138 138 0 0 0 -68 -120 Z" fill="#F59E0B" />
    
    <!-- Bottom magenta arc -->
    <path d="M -130 90 A 184 184 0 0 0 100 135 L 75 95 A 138 138 0 0 1 -95 65 Z" fill="#E11D48" />

    <!-- Left burgundy / wine arc -->

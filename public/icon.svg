    <!-- Outer Cyan / Blue arc -->
    <path d="M -80 -120 A 145 145 0 0 1 120 -20 L 88 -15 A 110 110 0 0 0 -60 -90 Z" fill="#0284C7" />
    
    <!-- Middle Dark Blue arc -->
    <path d="M -120 -20 A 120 120 0 0 1 50 -110 L 40 -80 A 90 90 0 0 0 -90 -15 Z" fill="#0369A1" />

    <!-- Lower vivid fuchsia overlay arc -->
    <path d="M 5 60 A 130 130 0 0 0 125 -10 L 95 -8 A 95 95 0 0 1 5 42 Z" fill="#DB2777" />
    
    <!-- Inner Emerald Green 'C' shape -->
    <path d="M 10 -65 A 65 65 0 1 0 55 40 L 25 35 A 40 40 0 1 1 -5 -40 Z" fill="#10B981" />
    <path d="M 5 -55 A 55 55 0 1 0 45 30 L 25 25 A 32 32 0 1 1 -5 -32 Z" fill="#059669" opacity="0.6" />
    
    <!-- Geometric confetti accents -->
    <!-- Top pink triangle pointing down -->
    <polygon points="-2,-195 24,-195 11,-165" fill="#EC4899" />
    <!-- Top yellow dot -->
    <circle cx="55" cy="-175" r="13" fill="#EAB308" />
    
    <!-- Upper right magenta triangle -->
    <polygon points="150,-115 180,-105 165,-80" fill="#E11D48" />
    <!-- Right green triangle pointing right -->
    <polygon points="140,-10 200,8 140,25" fill="#22C55E" />
    
    <!-- Mid right pink dot -->
    <circle cx="165" cy="55" r="10" fill="#F43F5E" />
    <!-- Mid right small cyan dot -->
    <circle cx="160" cy="35" r="6" fill="#0EA5E9" />
    
    <!-- Bottom left green dot -->
    <circle cx="-135" cy="115" r="14" fill="#22C55E" />
    <!-- Bottom left blue triangle -->
    <polygon points="-135,70 -195,95 -145,110" fill="#0284C7" />
    <!-- Far left pink dot -->
    <circle cx="-160" cy="65" r="7" fill="#F43F5E" />
